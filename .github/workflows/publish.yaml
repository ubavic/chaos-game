name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p $SSH_PORT -H new.ubavic.rs >> ~/.ssh/known_hosts

      - name: Transfer via rsync
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          USER: ${{ secrets.USER }}
        run: |
          rsync -az --delete \
            --exclude='.git/' --exclude='.github/' --exclude 'README.md' --exclude 'LICENSE' \
            -e "ssh -p $SSH_PORT -o BatchMode=yes -o IdentitiesOnly=yes" \
            . "$USER@new.ubavic.rs:/var/www/ubavic.rs/chaos_game/"